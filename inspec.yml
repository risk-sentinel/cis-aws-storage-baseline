name: cis-aws-storage-v1.0.0
title: AWS Storage Services CIS Baseline
maintainer: Risk Sentinel
copyright: Risk Sentinel
copyright_email: support@risk-sentinel.org
license: Apache-2.0
summary: |
  Validates AWS storage services against CIS AWS Storage Services Benchmark v1.0.0.
  Targets AWS Commercial (aws) and AWS GovCloud non-DoD (aws-us-gov).
  Per-control partition applicability is documented in
  partition_applicability.yml and encoded as `tag applicable_partitions:`.
version: 0.1.0
inspec_version: '>= 5.0'

inputs:
  - name: aws_partition
    type: string
    value: aws
    description: >-
      AWS partition the scan is running against.
      One of: aws (Commercial), aws-us-gov (GovCloud non-DoD).

  - name: scan_regions
    type: array
    value: []
    description: >-
      Regions to enumerate for multi-region resources (e.g. EBS volumes, C-2.4).
      Empty = every region (via ec2:DescribeRegions). Pin to the deployment
      regions to keep scans fast and quiet.

  # ---- document_attestation evidence-class bases ----
  - name: leveraged_evidence_base
    type: string
    value: ''
    description: Base for leveraged-SYSTEM AWS authorizations (no inherited controls in this profile).
  - name: policy_provider_base
    type: string
    value: ''
    description: Base for policy-PROVIDER documents the boundary leverages.
  - name: boundary_docs_base
    type: string
    value: ''
    description: Base for the boundary's OWN config/operational evidence records backing the 49 attestation controls.
  - name: attestation_max_age_days
    type: numeric
    value: 365
    description: Staleness window (days) for the storage attestation evidence records.

supports:
  - platform: aws

depends:
  - name: inspec-aws
    git: https://github.com/inspec/inspec-aws.git
    branch: main
    # TODO: pin to a tag after first green CI run.
